name: Publish to GitHub Maven Repo

on:
  workflow_run:
    workflows: ["Build cross-platform JAR"]  # name of your existing workflow
    types: [completed]

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download cross-platform JAR
        uses: actions/download-artifact@v4
        with:
          name: liboqs-java-crossplatform
          path: target/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Install to local Maven repo (gh-pages)
        run: |
          mvn install:install-file \
            -Dfile=target/liboqs-java.jar \
            -DgroupId=org.openquantumsafe \
            -DartifactId=liboqs-java \
            -Dversion=${{ github.event.workflow_run.head_branch }} \
            -Dpackaging=jar \
            -DlocalRepositoryPath=${{ github.workspace }}/gh-pages \
            -DcreateChecksum=true

      - name: Push to gh-pages
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish ${{ github.event.workflow_run.head_branch }}"
          git push
