name: liboqs-java CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  repository_dispatch:
    types: ["**"]

jobs:
  workflowcheck:
    name: Check validity of GitHub workflows
    runs-on: ubuntu-latest
    container: openquantumsafe/ci-ubuntu-latest:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # pin@v4
      - name: Ensure GitHub actions are valid
        run: actionlint -shellcheck "" # run *without* shellcheck

  linux:
    needs: workflowcheck
    runs-on: ubuntu-latest
    container: openquantumsafe/ci-ubuntu-latest:latest
    steps:
      - name: Checkout liboqs-java
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # pin@v4
      - name: Checkout liboqs main
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # pin@v4
        with:
          repository: open-quantum-safe/liboqs
          path: liboqs
          ref: main
      - name: Build liboqs
        run: mkdir build && cd build && cmake .. -G"Ninja" -DOQS_BUILD_ONLY_LIB=ON && ninja install
        working-directory: liboqs
      - name: Resolve all maven project dependencies
        run: mvn dependency:go-offline
      - name: Build liboqs-java and run tests
        run: export LD_LIBRARY_PATH="$LD_LIBRARY_PATH:/usr/local/lib" && mvn package
      - name: Compile KEM, Signatures and Rand examples
        run: |
          javac -cp target/liboqs-java.jar examples/KEMExample.java &&
          javac -cp target/liboqs-java.jar examples/SigExample.java &&
          javac -cp target/liboqs-java.jar examples/RandExample.java
      - name: Upload Linux native libraries
        uses: actions/upload-artifact@v4
        with:
          name: linux-natives
          path: target/classes/*.so
          if-no-files-found: error
      - name: Upload Java JAR
        uses: actions/upload-artifact@v4
        with:
          name: java-jar
          path: target/liboqs-java.jar

  macos:
    needs: workflowcheck
    runs-on: macos-latest
    steps:
      - name: Install Python
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # pin@v5
        with:
          python-version: '3.12'
      - name: Checkout liboqs-java
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # pin@v4
      - name: Checkout liboqs main
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # pin@v4
        with:
          repository: open-quantum-safe/liboqs
          path: liboqs
          ref: main
      - name: Install liboqs dependencies
        run: |
          env HOMEBREW_NO_AUTO_UPDATE=1 brew install ninja openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV
          export LDFLAGS="-L$(brew --prefix openssl@3)/lib"
          echo "LDFLAGS=$LDFLAGS"
      - name: Build liboqs
        run: mkdir build && cd build && cmake .. -G"Ninja" -DOQS_BUILD_ONLY_LIB=ON && sudo ninja install
        working-directory: liboqs
      - name: Resolve all maven project dependencies
        run: mvn dependency:go-offline
      - name: Build liboqs-java and run tests
        run: |
          export DYLD_LIBRARY_PATH="$DYLD_LIBRARY_PATH:/usr/local/lib"
          export OPENSSL_PATH=$(brew --prefix openssl@3)/lib
          mvn -P macosx "-Dlinker.end.option=/usr/local/lib/liboqs.a -L$OPENSSL_PATH -lcrypto" package
      - name: Compile KEM, Signatures and Rand examples
        run: |
          javac -cp target/liboqs-java.jar examples/KEMExample.java &&
          javac -cp target/liboqs-java.jar examples/SigExample.java &&
          javac -cp target/liboqs-java.jar examples/RandExample.java
      - name: Upload macOS native libraries
        uses: actions/upload-artifact@v4
        with:
          name: macos-natives
          path: |
            target/classes/*.jnilib
            target/classes/*.dylib
          if-no-files-found: error

  windows:
    needs: workflowcheck
    runs-on: windows-latest
    steps:
      - name: Checkout liboqs-java
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # pin@v4

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-cmake
            make

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'

      - name: Checkout liboqs main
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # pin@v4
        with:
          repository: open-quantum-safe/liboqs
          path: liboqs
          ref: main

      - name: Build liboqs (static library)
        shell: msys2 {0}
        run: |
          cd liboqs
          mkdir build
          cd build
          cmake .. -G "Ninja" -DOQS_BUILD_ONLY_LIB=ON -DBUILD_SHARED_LIBS=OFF
          ninja

      - name: Resolve Maven dependencies
        run: mvn dependency:go-offline

      - name: Build liboqs-java and run tests
        run: |
          $env:Path += ";$env:GITHUB_WORKSPACE\liboqs\build\lib"
          $includeDir = "$env:GITHUB_WORKSPACE\liboqs\build\include"
          $libDir = "$env:GITHUB_WORKSPACE\liboqs\build\lib"
          mvn -Pwindows "-Dliboqs.include.dir=$includeDir" "-Dliboqs.lib.dir=$libDir" package
      - name: Compile KEM, Signatures and Rand examples
        run: |
          javac -cp target\liboqs-java.jar examples\KEMExample.java
          javac -cp target\liboqs-java.jar examples\SigExample.java
          javac -cp target\liboqs-java.jar examples\RandExample.java
      - name: Upload Windows native libraries
        uses: actions/upload-artifact@v4
        with:
          name: windows-natives
          path: target/classes/*.dll
          if-no-files-found: error

  cross-platform-jar:
    name: Build cross-platform JAR
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Download Java JAR
        uses: actions/download-artifact@v4
        with:
          name: java-jar
          path: build-jar

      - name: Download Linux natives
        uses: actions/download-artifact@v4
        with:
          name: linux-natives
          path: natives/linux

      - name: Download macOS natives
        uses: actions/download-artifact@v4
        with:
          name: macos-natives
          path: natives/macos

      - name: Download Windows natives
        uses: actions/download-artifact@v4
        with:
          name: windows-natives
          path: natives/windows

      - name: Package fat JAR
        run: |
          cd build-jar
          # Copy all retrieved native shared libraries to root execution directory
          find ../natives -type f \( -name "*.so" -o -name "*.jnilib" -o -name "*.dylib" -o -name "*.dll" \) -exec cp {} . \;
          # Update the downloaded original JAR by appending the native libraries
          for file in *.so *.jnilib *.dylib *.dll; do
            if [ -f "$file" ]; then
              jar uf liboqs-java.jar "$file"
            fi
          done

      - name: Upload cross-platform JAR
        uses: actions/upload-artifact@v4
        with:
          name: liboqs-java-crossplatform
          path: build-jar/liboqs-java.jar

  publish:
    name: Publish to GitHub Maven Repo
    needs: cross-platform-jar
    # Optional: Only run this on push events (avoids publishing from unmerged pull requests)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download cross-platform JAR
        uses: actions/download-artifact@v4
        with:
          name: liboqs-java-crossplatform
          path: target/

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Get version from POM
        id: get-version
        run: echo "version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT

      - name: Install to gh-pages
        run: |
          mvn install:install-file \
            -Dfile=target/liboqs-java.jar \
            -DgroupId=org.openquantumsafe \
            -DartifactId=liboqs-java \
            -Dversion=${{ steps.get-version.outputs.version }} \
            -Dpackaging=jar \
            -DlocalRepositoryPath=${{ github.workspace }}/gh-pages \
            -DcreateChecksum=true

      - name: Push to gh-pages
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish ${{ github.ref_name }}"
          git push
